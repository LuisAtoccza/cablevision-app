<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cablevision Peru V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0033A0 0%, #001a52 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; width: 100%; max-width: 420px; }
        .login-logo { width: 80px; height: 80px; background: linear-gradient(135deg, #0033A0 0%, #FF6B00 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 36px; }
        .login-title { text-align: center; color: #0033A0; font-weight: 700; margin-bottom: 5px; }
        .login-subtitle { text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 30px; }
        .form-control { border-radius: 10px; padding: 12px 15px; border: 2px solid #e9ecef; }
        .form-control:focus { border-color: #0033A0; box-shadow: 0 0 0 0.2rem rgba(0,51,160,0.15); }
        .btn-login { background: linear-gradient(135deg, #FF6B00 0%, #e55a00 100%); border: none; border-radius: 10px; padding: 12px; color: white; font-weight: 600; width: 100%; }
        .btn-login:hover { background: linear-gradient(135deg, #e55a00 0%, #cc4e00 100%); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo"><i class="fas fa-broadcast-tower"></i></div>
        <h4 class="login-title">CABLEVISION PERU V2</h4>
        <p class="login-subtitle">Planta Externa + SST</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user me-2"></i>Usuario</label>
                <input type="text" class="form-control" name="username" placeholder="supervisor" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-lock me-2"></i>Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="admin123" required>
            </div>
            <button type="submit" class="btn btn-login"><i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesion</button>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted">Usuario: <strong>supervisor</strong> | Password: <strong>admin123</strong></small>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

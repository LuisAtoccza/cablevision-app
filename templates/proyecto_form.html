{% extends "base.html" %}

{% block title %}Nuevo Proyecto{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-plus me-2 text-primary"></i>Nuevo Proyecto</h2>
    <a href="{{ url_for('proyectos') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Volver</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Tipo de Proyecto *</label>
                    <select name="tipo_id" class="form-select" required>
                        <option value="">Seleccione...</option>
                        {% for t in tipos %}<option value="{{ t.id }}">{{ t.prefijo }} - {{ t.nombre }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Año *</label>
                    <input type="number" name="anio" class="form-control" value="2026" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha Inicio *</label>
                    <input type="date" name="fecha_inicio" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre del Proyecto *</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Proyecto FTTH - Zona Ate Vitarte" required>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Ubicacion</label>
                    <input type="text" name="ubicacion" class="form-control" placeholder="Calle, Avenida, etc.">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Zona/Distrito</label>
                    <input type="text" name="zona" class="form-control" placeholder="Ej: Ate, La Molina, Miraflores">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Fecha Fin Estimada *</label>
                    <input type="date" name="fecha_fin_estimada" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Responsable</label>
                    <select name="responsable_id" class="form-select">
                        <option value="">Por asignar</option>
                        {% for r in responsables %}<option value="{{ r.id }}">{{ r.nombre }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Contratista</label>
                    <select name="contratista_id" class="form-select">
                        <option value="">Sin contratista</option>
                        {% for c in contratistas %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Costo Estimado (S/)</label>
                    <input type="number" name="costo_estimado" class="form-control" placeholder="0.00">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea name="observaciones" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('proyectos') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-cv"><i class="fas fa-save me-2"></i>Crear Proyecto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
